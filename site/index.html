<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="icon" href="../brand/favicon.svg">
</head><body>
<title>Шахматка</title>
<meta name="description" content="Шахматка — независимое медиа о новостройках Москвы и России">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: тёплое светлое полотно, мягкие панели без рамок, крупные лёгкие цифры, градиент «лаванда → персик» для акцентных карточек, плавающая панель навигации снизу */
:root {
  --bg: #FBFAF6;          /* полотно */
  --panel: #FFFFFF;       /* белые карточки */
  --soft: #F3F1EB;        /* мягкие панели */
  --ink: #1B1B1D;         /* графит */
  --grey: #ABA79F;        /* светлый второй тон заголовков и дробей */
  --muted: #6F6B64;       /* подписи */
  --line: #EAE7DF;
  --sun: #FFD54A;         /* жёлтый: текущее, «в работе» */
  --sun-soft: #FFF2BF;
  --orange: #FF8A3D;      /* линия графика, акцент */
  --coral: #F0644F;       /* «ушёл», риск */
  --coral-soft: #FCE0DA;
  --lilac: #DDE1F8;       /* холодная часть градиента */
  --grad: linear-gradient(165deg, #E3E5F8 0%, #EEE8E2 34%, #FFDF95 70%, #FFB86A 100%);
  --grad-soft: linear-gradient(165deg, #ECEEFB 0%, #F6F0E6 50%, #FFEBC2 100%);
  --shadow: 0 1px 2px rgba(27, 27, 29, .04), 0 8px 24px rgba(27, 27, 29, .06);
  --on-dark: #FFFFFF;
  --f-display: "Unbounded", "Segoe UI", sans-serif;
  --f-text: "Onest", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --s-2: 11.5px; --s-1: 12.5px; --s0: 15px; --s1: 17px; --s2: 20px; --s3: 24px; --s4: 30px; --s5: 44px;
  --r: 22px; --r-m: 16px; --r-s: 12px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --panel: #1A1A1B; --soft: #202021; --ink: #F3F1EC; --grey: #6F6C66; --muted: #A29E96; --line: #2B2A28;
    --sun: #FFD54A; --sun-soft: #3A3115; --orange: #FF9550; --coral: #F37A67; --coral-soft: #3B1F1A; --lilac: #2A2D44;
    --grad: linear-gradient(165deg, #2B2E45 0%, #3A3330 40%, #8A6522 78%, #A8622A 100%);
    --grad-soft: linear-gradient(165deg, #23253A 0%, #2A2622 55%, #3A3016 100%);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); --on-dark: #111111;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --panel: #1A1A1B; --soft: #202021; --ink: #F3F1EC; --grey: #6F6C66; --muted: #A29E96; --line: #2B2A28;
  --sun: #FFD54A; --sun-soft: #3A3115; --orange: #FF9550; --coral: #F37A67; --coral-soft: #3B1F1A; --lilac: #2A2D44;
  --grad: linear-gradient(165deg, #2B2E45 0%, #3A3330 40%, #8A6522 78%, #A8622A 100%);
  --grad-soft: linear-gradient(165deg, #23253A 0%, #2A2622 55%, #3A3016 100%);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); --on-dark: #111111;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: var(--s0); line-height: 1.5; font-variant-numeric: tabular-nums; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; display: block; }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 400; }
p { margin: 0; }

/* двухтонный заголовок: первая строка графит, вторая светло-серая */
.tt { font-family: var(--f-display); font-weight: 300; letter-spacing: -0.03em; line-height: 1.12; }
.tt span { display: block; color: var(--grey); }
/* крупные лёгкие числа с серой дробной частью */
.num { font-family: var(--f-display); font-weight: 300; letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
.num .fr { color: var(--grey); }
.num sup { font-family: var(--f-text); font-weight: 500; font-size: 0.32em; letter-spacing: 0; vertical-align: 0.9em; margin-right: 0.12em; color: var(--muted); }
.num .u { font-family: var(--f-text); font-weight: 500; font-size: 0.3em; letter-spacing: 0; color: var(--muted); margin-left: 0.25em; }

/* ---------- логотип ---------- */
.wm { display: inline-flex; align-items: baseline; text-decoration: none; font-family: var(--f-display); font-weight: 500; letter-spacing: -0.035em; line-height: 1; color: var(--ink); }
.wm svg { height: 0.57em; width: auto; margin-left: 0.06em; margin-right: 0.06em; overflow: visible; }
.cell-f { fill: var(--ink); }
.cell-e { fill: none; stroke: var(--grey); }
.cell-a { fill: url(#sunGrad); }

/* ---------- шапка ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 720px; margin: 0 auto; padding-inline: var(--gutter); height: 60px; display: flex; align-items: center; gap: 8px; }
.top .wm { font-size: 21px; }
.top .sp { flex: 1; }
.round { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); text-decoration: none; border: 0; cursor: pointer; }
.round svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.demo { max-width: 720px; margin: 0 auto; padding: 2px var(--gutter) 0; }
.demo span { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--sun-soft); font-size: var(--s-2); color: var(--ink); }
.demo i { width: 6px; height: 6px; border-radius: 50%; background: var(--orange); flex: none; }

main { max-width: 720px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 6px 120px; }

/* ---------- плавающая панель ---------- */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.dock a { display: flex; align-items: center; gap: 7px; height: 46px; padding: 0 13px; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: var(--s-1); font-weight: 500; }
.dock a svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.dock a span { display: none; }
.dock a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.dock a[aria-current="page"] span { display: inline; }

/* ---------- общие ---------- */
.card { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); }
.soft { background: var(--soft); border-radius: var(--r); }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-h h2 { font-size: var(--s2); }
.sec-h a { font-size: var(--s-1); font-weight: 500; text-decoration: none; padding: 7px 12px; border-radius: 999px; background: var(--panel); box-shadow: var(--shadow); white-space: nowrap; }
.note { color: var(--muted); font-size: var(--s-1); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--panel); font-size: var(--s-1); font-weight: 500; text-decoration: none; white-space: nowrap; box-shadow: 0 0 0 1px var(--line); }
a.pill:hover { box-shadow: 0 0 0 1px var(--ink); }
.pill.sun { background: var(--sun); box-shadow: none; color: #1B1B1D; }
.pill.coral { background: var(--coral); box-shadow: none; color: #fff; }
.pill.dark { background: var(--ink); color: var(--bg); box-shadow: none; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.zu { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 6px; border-radius: 999px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); font-size: var(--s-1); font-weight: 500; }
.zu b { font-family: var(--f-display); font-weight: 500; font-size: 9px; letter-spacing: 0; padding: 3px 6px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.page-h { margin-top: 18px; font-size: var(--s4); }
.arrow { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1px currentColor; }
.arrow svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* стадия: 6 сегментов-клеток */
.strip { display: inline-grid; grid-auto-flow: column; gap: 3px; vertical-align: middle; }
.strip i { width: 10px; height: 10px; border-radius: 3px; background: var(--line); }
.strip i.done { background: var(--ink); }
.strip i.now { background: var(--sun); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--sun) 35%, transparent); }
.strip.out i.done, .strip.out i.now { background: var(--coral); box-shadow: none; opacity: .55; }
/* стадия: шкала с маркером, как бегунок */
.track { position: relative; margin-top: 18px; }
.track .bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.track .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sun-soft), var(--sun) 60%, var(--orange)); }
.track .mk { position: absolute; top: 12px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--ink); transform: translateX(-6px); }
.track .ends { display: flex; justify-content: space-between; margin-top: 24px; font-size: var(--s-2); color: var(--grey); }

/* ---------- главная ---------- */
.hello { margin-top: 18px; font-size: var(--s4); }
.kpi { margin-top: 18px; padding: 18px 16px 12px; }
.kpi-h { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.kpi-h h2 { font-size: var(--s0); font-weight: 600; font-family: var(--f-text); }
.kpi-h p { font-size: var(--s-2); color: var(--grey); margin-top: 2px; }
.kpi-row { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 10px; margin-top: 18px; }
.kpi-row .num { font-size: 31px; }
.kpi-row small { display: block; font-size: var(--s-2); color: var(--muted); margin-top: 6px; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.chart svg { width: 100%; height: auto; display: block; margin-top: 4px; overflow: visible; }

.slides { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: calc(var(--gutter) * -1); padding: 4px var(--gutter) 12px; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.story { scroll-snap-align: start; flex: 0 0 86%; max-width: 420px; text-decoration: none; padding: 8px; display: flex; flex-direction: column; }
.story .ph { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-m); overflow: hidden; background: var(--soft); }
.story .ph img { width: 100%; height: 100%; object-fit: cover; }
.story .pager { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.story .pager i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 600; background: color-mix(in srgb, var(--panel) 70%, transparent); color: var(--ink); backdrop-filter: blur(6px); }
.story .pager i.on { background: var(--sun); color: #1B1B1D; }
.story .tags { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
.story .tags span { padding: 4px 10px; border-radius: 999px; font-size: var(--s-2); font-weight: 500; color: #fff; background: rgba(20, 20, 20, .38); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.story .tx { padding: 14px 8px 8px; display: grid; gap: 8px; }
.story h3 { font-family: var(--f-display); font-weight: 400; font-size: var(--s1); letter-spacing: -0.025em; line-height: 1.25; }
.story time { font-size: var(--s-2); color: var(--grey); }
.story:hover h3 { text-decoration: underline; text-underline-offset: 4px; }

.rows { list-style: none; margin: 0; padding: 6px 16px; }
.rows li + li { border-top: 1px solid var(--line); }
.rows a, .rows .nl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 0; text-decoration: none; align-items: center; }
.rows .t { font-weight: 500; line-height: 1.35; min-width: 0; }
.rows .s { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--s-1); color: var(--muted); }
.rows .s b { color: var(--ink); font-weight: 600; }
.rows a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.rows .nl .t { color: var(--muted); }

.pro { margin-top: 34px; padding: 22px 20px 20px; border-radius: var(--r); background: var(--grad); display: grid; gap: 18px; overflow: hidden; color: #1B1B1D; }
.pro .top-r { display: flex; justify-content: space-between; align-items: center; }
.pro .top-r p { font-size: var(--s-1); color: rgba(27, 27, 29, .6); }
.pro h2 { font-family: var(--f-display); font-weight: 300; font-size: 28px; line-height: 1.12; letter-spacing: -0.035em; }
.pro h2 span { display: block; font-weight: 400; }
.pro ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: var(--s-1); }
.pro li { display: flex; gap: 8px; align-items: baseline; }
.pro li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #1B1B1D; flex: none; transform: translateY(-1px); }
.pro .act { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pro .btn { background: #1B1B1D; color: #fff; }
.pro .arrow { color: #1B1B1D; }
.pro .msg { font-size: var(--s-1); }
:root[data-theme="dark"] .pro, :root[data-theme="dark"] .pro .arrow { color: #F3F1EC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pro, :root:not([data-theme="light"]) .pro .arrow { color: #F3F1EC; } :root:not([data-theme="light"]) .pro .top-r p { color: rgba(243, 241, 236, .7); } :root:not([data-theme="light"]) .pro li::before { background: #F3F1EC; } }
.btn { display: inline-flex; justify-content: center; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); font-weight: 500; font-size: var(--s0); cursor: pointer; text-decoration: none; }
.btn:hover { opacity: .9; }

.devs { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: calc(var(--gutter) * -1); padding: 4px var(--gutter) 12px; scrollbar-width: none; }
.devs::-webkit-scrollbar { display: none; }
.dev-card { scroll-snap-align: start; flex: 0 0 auto; width: 148px; padding: 16px; text-decoration: none; display: grid; gap: 22px; }
.dev-card .mono { width: 40px; height: 40px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-family: var(--f-display); font-weight: 500; font-size: 11px; letter-spacing: -0.02em; }
.dev-card .num { font-size: 26px; }
.dev-card b { display: block; font-weight: 600; font-size: var(--s0); margin-top: 4px; }
.dev-card small { color: var(--muted); font-size: var(--s-2); }

footer.foot { margin-top: 40px; padding: 22px 4px 0; display: grid; gap: 10px; font-size: var(--s-1); color: var(--muted); border-top: 1px solid var(--line); }
footer.foot .wm { font-size: 18px; }
footer.foot a { color: var(--ink); }

/* ---------- списки ---------- */
.search { position: relative; margin-top: 16px; }
.search input { width: 100%; height: 52px; padding: 0 18px 0 46px; border-radius: 999px; border: 0; background: var(--panel); box-shadow: var(--shadow); color: var(--ink); font: inherit; }
.search input:focus { outline: none; box-shadow: var(--shadow), 0 0 0 2px var(--sun); }
.search svg { position: absolute; left: 17px; top: 16px; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
.filters { display: flex; gap: 6px; overflow-x: auto; margin: 12px calc(var(--gutter) * -1) 0; padding: 2px var(--gutter) 6px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 0; background: var(--panel); box-shadow: 0 0 0 1px var(--line); border-radius: 999px; padding: 8px 14px; font-size: var(--s-1); font-weight: 500; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.empty { padding: 22px 0; color: var(--muted); }

/* ---------- объект ---------- */
.crumbs { margin-top: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: var(--s-1); color: var(--grey); }
.crumbs a { text-decoration: none; color: var(--muted); font-weight: 500; }
.crumbs a:hover { color: var(--ink); }
.hero { position: relative; margin-top: 14px; aspect-ratio: 4 / 4.2; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--soft); }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .tags { position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hero .tags span { padding: 6px 12px; border-radius: 999px; font-size: var(--s-1); font-weight: 500; color: #fff; background: rgba(20, 20, 20, .38); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hero .tags .logo-chip { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; background: #fff; }
.hero .tags .logo-chip svg { width: 18px; }
.credit { font-size: var(--s-2); color: var(--grey); margin-top: 8px; padding-left: 4px; }
.obj-h1 { margin-top: 18px; font-size: var(--s4); }
.zus { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.stage { margin-top: 18px; padding: 18px 16px 16px; }
.stage .row { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.stage .num { font-size: 46px; }
.stage .lbl { font-size: var(--s-1); color: var(--muted); text-align: right; }
.stage .lbl b { display: block; color: var(--ink); font-size: var(--s0); font-weight: 600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.tile { padding: 16px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.tile dt { font-size: var(--s-1); color: var(--muted); }
.tile dd { margin: 0; }
.tile .num { font-size: 30px; }
.tile .txt { font-family: var(--f-display); font-weight: 400; font-size: var(--s1); letter-spacing: -0.025em; line-height: 1.2; }
.tile small { font-size: var(--s-2); color: var(--grey); }
.tile.wide { grid-column: 1 / -1; }

.tl { list-style: none; margin: 0; padding: 8px 16px; }
.tl li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; align-items: start; }
.tl li + li { border-top: 1px solid var(--line); }
.tl time { font-size: var(--s-2); color: var(--grey); grid-column: 1 / -1; }
.tl p { font-weight: 500; line-height: 1.4; }

.locked { position: relative; padding: 20px; border-radius: var(--r); background: var(--grad-soft); overflow: hidden; display: grid; gap: 14px; }
.locked .ghost { display: flex; gap: 18px; filter: blur(6px); user-select: none; pointer-events: none; }
.locked .ghost .num { font-size: 40px; }
.locked b { font-family: var(--f-display); font-weight: 400; font-size: var(--s1); letter-spacing: -0.025em; }
.locked p { font-size: var(--s-1); color: var(--muted); }

.courts { padding: 18px 16px; border-radius: var(--r); border: 1.5px dashed var(--line); display: grid; gap: 8px; }
.courts b { font-weight: 600; }
.courts ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: var(--s-1); display: grid; gap: 3px; }

/* ---------- застройщик ---------- */
.dev-h { display: flex; gap: 14px; align-items: center; margin-top: 18px; }
.dev-mono { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--grad); display: grid; place-items: center; font-family: var(--f-display); font-weight: 500; font-size: 15px; color: #1B1B1D; }
.dev-h h1 { font-size: var(--s4); }
.dev-h h1 span { font-size: var(--s2); margin-top: 4px; }

/* ---------- статья ---------- */
.art-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.art-meta time, .art-meta .rd { font-size: var(--s-1); color: var(--grey); margin-left: 4px; }
.art h1 { font-family: var(--f-display); font-weight: 300; font-size: 27px; line-height: 1.16; letter-spacing: -0.035em; margin-top: 14px; }

const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const d = s => { const [y, m, dd] = s.split('-').map(Number); return `${dd} ${MONTHS[m - 1]} ${y}`; };
const dm = s => { const [, m, dd] = s.split('-').map(Number); return `${dd} ${MONTHS[m - 1]}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  .replace(/(\d) (тыс|млн|₽|м²|кв\.|этаж)/g, '$1 $2').replace(/(тыс\.|млн) (₽)/g, '$1 $2');
const objById = id => OBJS.find(o => o.id === id);
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c; };
/* число: целая часть графитом, дробная серым */
function num(v, { sup = '', unit = '' } = {}) {
  const [i, f] = String(v).split(',');
  return `<span class="num">${sup ? `<sup>${sup}</sup>` : ''}${i}${f !== undefined ? `<span class="fr">,${f}</span>` : ''}${unit ? `<span class="u">${unit}</span>` : ''}</span>`;
}
function strip(stage, out = false) {
  let h = '';
  for (let i = 0; i < 6; i++) h += `<i class="${i < stage ? 'done' : i === stage ? 'now' : ''}"></i>`;
  return `<span class="strip${out ? ' out' : ''}" role="img" aria-label="Стадия: ${STAGES[stage]}, ${stage + 1} из 6">${h}</span>`;
}
function stagePill(o, out = false) {
  return out ? `<span class="pill coral">Ушёл из портфеля</span>` : `<span class="pill ${o.stage === 4 ? 'sun' : ''}">${STAGES[o.stage]}</span>`;
}
function track(stage) {
  const pct = (stage + 0.5) / 6 * 100;
  return `<div class="track" role="img" aria-label="Стадия ${stage + 1} из 6: ${STAGES[stage]}"><div class="bar"><i style="width:${pct}%"></i></div><span class="mk" style="left:${pct}%"></span>
    <div class="ends" aria-hidden="true"><span>${STAGES[0]}</span><span>${STAGES[5]}</span></div></div>`;
}
function objRow(o, out = false) {

function readItem(k, a) {

/* график ставки: ступени решений ЦБ, оранжевая линия с мягкой заливкой */
function rateChart() {
  const W = 340, H = 168, L = 6, R = 6, T = 30, B = 26;
  const t = s => Date.parse(s), t0 = t(RATE[0][0]), t1 = t('2026-10-13');
  const X = s => L + (t(s) - t0) / (t1 - t0) * (W - L - R);
  const lo = 13, hi = 21, Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let p = `M${X(RATE[0][0]).toFixed(1)} ${Y(RATE[0][1]).toFixed(1)}`;
  for (let i = 1; i < RATE.length; i++) { const x = X(RATE[i][0]); p += `H${(x - 4).toFixed(1)}Q${x.toFixed(1)} ${Y(RATE[i - 1][1]).toFixed(1)} ${x.toFixed(1)} ${((Y(RATE[i - 1][1]) + Y(RATE[i][1])) / 2).toFixed(1)}Q${x.toFixed(1)} ${Y(RATE[i][1]).toFixed(1)} ${(x + 4).toFixed(1)} ${Y(RATE[i][1]).toFixed(1)}`; }
  p += `H${X('2026-10-13').toFixed(1)}`;
  const area = p + `V${H - B}H${L}Z`;
  const grid = [14, 17, 20].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W - R}" y="${Y(v) - 5}" text-anchor="end" font-size="10" fill="var(--grey)">${v}%</text>`).join('');
  const ticks = [['2025-07-01', 'июль'], ['2026-01-01', 'январь'], ['2026-07-01', 'июль']].map(([s, l]) => `<text x="${X(s)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--grey)">${l}</text>`).join('');
  const last = RATE[RATE.length - 1], first = RATE[0];
  const lx = X(last[0]), ly = Y(last[1]), fx = X(first[0]), fy = Y(first[1]);
  const pts = RATE.map(([s, v]) => `<circle cx="${X(s)}" cy="${Y(v)}" r="9" fill="transparent"><title>${d(s)}: ${String(v).replace('.', ',')}%</title></circle>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ключевая ставка снизилась с 20 до 14,25 процента за год">
    <defs><linearGradient id="rateFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--orange)" stop-opacity=".22"/><stop offset="1" stop-color="var(--orange)" stop-opacity="0"/></linearGradient>
      <linearGradient id="rateLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--sun)"/><stop offset="1" stop-color="var(--orange)"/></linearGradient></defs>
    ${grid}${ticks}
    <path d="${area}" fill="url(#rateFill)"/>
    <path class="line" d="${p}" fill="none" stroke="url(#rateLine)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${fx}" cy="${fy}" r="3.5" fill="var(--panel)" stroke="var(--sun)" stroke-width="2"/>
    <g transform="translate(${fx + 8} ${fy - 24})"><rect width="44" height="20" rx="10" fill="var(--panel)" stroke="var(--line)"/><text x="22" y="14" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">20%</text></g>
    <circle cx="${lx}" cy="${ly}" r="5" fill="var(--orange)" stroke="var(--panel)" stroke-width="2.5"/>
    <g transform="translate(${lx - 30} ${ly - 30})"><rect width="60" height="20" rx="10" fill="var(--ink)"/><text x="30" y="14" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--bg)">14,25%</text></g>
    ${pts}
  </svg></div>`;
}

/* ===================== РОУТЕР ===================== */
const app = $('#app');
let objState = { q: '', st: -1 };
function route() {
  const h = (location.hash || '#home').slice(1);
  let html, tab = '';
  if (h === 'home' || h === '') { html = home(); tab = 'home'; }
  else if (h === 'objects') { html = objects(objState.q, objState.st); tab = 'objects'; }
  else if (h === 'developers') { html = developers(); tab = 'developers'; }
  else if (h === 'pro') { html = pro(); tab = 'pro'; }
  else if (h === 'brand') { html = brand(); }
  else if (h === 'a22') { html = article(); tab = 'home'; }
  else if (h.startsWith('dev-') && DEVS[h.slice(4)]) { html = developer(h.slice(4)); tab = 'developers'; }
  else if (objById(h)) { html = object(objById(h)); tab = 'objects'; }
  else { html = `<p class="empty">Такой страницы нет. <a href="#home">Вернуться в ленту</a></p>`; }
  app.innerHTML = `<div class="view">${html}</div>`;
  document.querySelectorAll('.dock a').forEach(a => { if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (h === 'objects') {
    fillObjects(objState.q, objState.st);
    $('#q').addEventListener('input', e => { objState.q = e.target.value; fillObjects(objState.q, objState.st); });
    document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
      objState.st = Number(b.dataset.st);
      document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === b));
      fillObjects(objState.q, objState.st);
    }));
  }
  app.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => { b.closest('.pro').querySelector('.msg').hidden = false; }));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
